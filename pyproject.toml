[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-platform-infra"
version = "0.1.0"
description = "Local Podman and Traefik development platform"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3", "typer>=0.16,<1"]

[project.scripts]
lp = "lp.cli:main"

[tool.setuptools]
packages = ["lp"]
